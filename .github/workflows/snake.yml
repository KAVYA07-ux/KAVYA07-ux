name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: YOUR_USERNAME

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23c77dff&color_dots=%23d8f3dc,%23b7e4c7,%2395d5b2,%2352b788,%232d6a4f

            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23c77dff&color_dots=%232d1b69,%233c096c,%235a189a,%237b2cbf,%239d4edd

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
